<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bang Search</title>
<meta name="description" content="A static DuckDuckGo-style bang search page.">
<style>
:root{--bg:#fff;--fg:#222;--muted:#6b7280;--line:#e5e7eb;--accent:#de5833;--accent2:#c74624}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{min-height:100%;display:grid;place-items:center;padding:40px 18px}
.wrap{width:min(760px,100%);text-align:center;margin-top:-8vh}
.logo{font-size:clamp(46px,9vw,76px);font-weight:800;letter-spacing:-.06em;color:var(--accent);margin:0 0 26px}
.logo span{color:#222}
.search{display:flex;align-items:center;background:#fff;border:1px solid #cfd3d7;border-radius:8px;box-shadow:0 2px 7px #00000012;padding:5px 7px 5px 16px;transition:.15s}
.search:focus-within{border-color:#aaa;box-shadow:0 4px 14px #00000018}
input{flex:1;min-width:0;border:0;outline:0;font-size:18px;padding:11px 4px;color:var(--fg);background:transparent}
button{border:0;border-radius:5px;background:var(--accent);color:#fff;font-weight:700;padding:11px 18px;cursor:pointer}
button:hover{background:var(--accent2)}
.hint{margin:18px 0 0;color:var(--muted);font-size:14px}
.hint code{background:#f3f4f6;border-radius:4px;padding:2px 5px;color:#444}
.results{margin-top:25px;text-align:left}
.card{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;margin-top:9px;background:#fff;cursor:pointer}
.card:hover{box-shadow:0 3px 12px #0000000f}
.card strong{display:block}.card small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:570px}
.badge{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);white-space:nowrap}
.empty{color:var(--muted);padding:18px}
footer{position:fixed;bottom:15px;left:0;right:0;text-align:center;color:#9ca3af;font-size:12px}
@media(max-width:560px){main{padding:28px 12px}.wrap{margin-top:-4vh}.search{padding-left:12px}button{padding:10px 13px}.hint{font-size:13px}.card small{max-width:70vw}}
</style>
</head>
<body>
<main>
<section class="wrap">
<h1 class="logo">bang<span>!</span></h1>
<form class="search" id="searchForm" autocomplete="off">
<input id="query" aria-label="Search" placeholder="Search with a bang, e.g. !w kittens" autofocus disabled>
<button type="submit" disabled>Search</button>
</form>
<p class="hint">Use <code>!bang query</code> to jump to a site, or type to discover bangs.</p>
<div class="results" id="results" aria-live="polite"></div>
</section>
</main>
<footer>Static HTML + JavaScript · No backend</footer>

<script>
let BANGS = [];

async function loadBangs() {
  try {
    const response = await fetch("./bangs.json", { cache: "no-cache" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    BANGS = await response.json();

    document.getElementById("query").disabled = false;
    document.querySelector("#searchForm button").disabled = false;
  } catch (error) {
    console.error("Failed to load bangs.json:", error);
    document.getElementById("results").innerHTML =
      '<div class="empty">Could not load bangs.json. Make sure bangs.json is next to this HTML file and serve the folder over HTTP.</div>';
  }
}const input = document.getElementById("query");
const form = document.getElementById("searchForm");
const results = document.getElementById("results");

const esc = s => s.replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function findBang(token){
  const t = token.toLowerCase();
  return BANGS.find(b => b.bang.toLowerCase() === t);
}

function resolveTemplate(template, query) {
  const encoded = encodeURIComponent(query.trim());

  // Bang data uses $1 as the search-query placeholder.
  // Replace the literal token before navigating.
  return String(template)
    .replace(/\$1/g, encoded)
    .replace(/\$2/g, encoded)
    .replace(/%s/gi, encoded)
    .replace(/\{\{query\}\}/gi, encoded)
    .replace(/\{query\}/gi, encoded);
}

function search(raw){
  const q = raw.trim();
  if(!q) return;

  const parts = q.split(/\s+/);
  const bang = parts[0].startsWith("!") ? findBang(parts[0]) : null;

  if(bang){
    const searchTerms = parts.slice(1).join(" ");
    const url = resolveTemplate(bang.url, searchTerms);

    if (/\$(?:1|2)|%s|\{\{?query\}?\}/i.test(url)) {
      console.error("Unresolved bang placeholder:", bang, url);
      results.innerHTML =
        '<div class="empty">This bang has an unsupported URL template.</div>';
      return;
    }

    if(/^https?:\/\//i.test(url)){
      location.href=url;
      return;
    }
  }

  // Ordinary searches use DuckDuckGo.
  location.href = "https://duckduckgo.com/?q=" + encodeURIComponent(q);
}

function suggest(value){
  const q = value.trim().toLowerCase();
  if(q.length < 2){ results.innerHTML = ""; return; }

  const first = q.split(/\s+/)[0];
  const matches = BANGS.filter(b =>
    b.bang.toLowerCase().startsWith(first) ||
    b.name.toLowerCase().includes(q)
  ).slice(0, 8);

  if(!matches.length){
    results.innerHTML = '<div class="empty">No matching bangs found.</div>';
    return;
  }

  results.innerHTML = matches.map(b => `
    <div class="card" data-bang="${esc(b.bang)}">
      <div><strong>${esc(b.name)}</strong><small>${esc(b.url)}</small></div>
      <div class="badge">${esc(b.bang)}</div>
    </div>
  `).join("");

  results.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => {
      input.value = card.dataset.bang + " ";
      input.focus();
    });
  });
}

form.addEventListener("submit", e => { e.preventDefault(); search(input.value); });
input.addEventListener("input", e => suggest(e.target.value));
loadBangs();
</script>
</body>
</html>
<script>loadBangs();</script>
